name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: OpenAPI CLI smoke
        run: node apps/cli/dist/index.cjs build --openapi fixtures/openapi/support.yaml --name ci-openapi --out dist/ci-openapi
      - name: MCP CLI smoke
        run: node apps/cli/dist/index.cjs build --mcp fixtures/mcp/stdio.json --no-discover --name ci-mcp --out dist/ci-mcp
      - name: PluginIR CLI smoke
        run: node apps/cli/dist/index.cjs build --ir fixtures/hello/plugin-ir.json --out dist/ci-ir
      - name: Validate smoke packages
        run: |
          node apps/cli/dist/index.cjs validate dist/ci-openapi
          node apps/cli/dist/index.cjs validate dist/ci-mcp
          node apps/cli/dist/index.cjs validate dist/ci-ir
      - name: Security, compatibility, and certification smoke packages
        run: |
          node apps/cli/dist/index.cjs scan dist/ci-openapi
          node apps/cli/dist/index.cjs scan dist/ci-mcp
          node apps/cli/dist/index.cjs scan dist/ci-ir
          node apps/cli/dist/index.cjs compat dist/ci-openapi --all
          node apps/cli/dist/index.cjs compat dist/ci-mcp --all
          node apps/cli/dist/index.cjs compat dist/ci-ir --all
          node apps/cli/dist/index.cjs certify dist/ci-openapi
          node apps/cli/dist/index.cjs certify dist/ci-mcp
          node apps/cli/dist/index.cjs certify dist/ci-ir
      - name: Pack and verify CLI
        run: |
          pnpm pack:cli
          pnpm verify:package
          pnpm verify:package:checksum
      - name: Installed package smoke
        run: |
          TARBALL="$GITHUB_WORKSPACE/artifacts/agent-plugin-ci-cli-$(node -p "require('./apps/cli/package.json').version").tgz"
          mkdir -p "$RUNNER_TEMP/agentplugin-smoke"
          cd "$RUNNER_TEMP/agentplugin-smoke"
          npm init -y >/dev/null
          npm install "$TARBALL" --ignore-scripts --no-audit --no-fund
          test "$(./node_modules/.bin/agentplugin --version)" = "$(node -p "require(process.env.GITHUB_WORKSPACE + '/apps/cli/package.json').version")"
          ./node_modules/.bin/agentplugin build --openapi "$GITHUB_WORKSPACE/fixtures/openapi/search.json" --name packaged-smoke --out out --json
          ./node_modules/.bin/agentplugin validate out --json
          ./node_modules/.bin/agentplugin scan out --json
          ./node_modules/.bin/agentplugin compat out --all --json
          ./node_modules/.bin/agentplugin certify out --json
          mkdir runtime-package
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'runtime-package';
          fs.writeFileSync(path.join(root, 'plugin.json'), JSON.stringify({
            $schema: 'https://agent-plugins.org/schemas/1.0.0/plugin.schema.json',
            name: 'packaged-runtime-smoke'
          }));
          fs.writeFileSync(path.join(root, 'mcp.json'), JSON.stringify({
            $schema: 'https://agent-plugins.org/schemas/1.0.0/mcp.schema.json',
            mcpServers: { fixture: { type: 'stdio', command: 'node', args: [path.join(process.env.GITHUB_WORKSPACE, 'packages/ingest-mcp/test-fixtures/stdio-server.mjs')] } }
          }));
          NODE
          ./node_modules/.bin/agentplugin compat-runtime runtime-package --allow-stdio-runtime --timeout-ms 5000 --json
          ./node_modules/.bin/agentplugin compat-runtime runtime-package --client-adapter synthetic-fixture --allow-client-runtime --allow-synthetic-fixture --json
      - run: git diff --check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentplugin-cli-package
          path: |
            artifacts/*.tgz
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
