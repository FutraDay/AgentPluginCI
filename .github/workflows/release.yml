name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches CLI version
        run: node -e "const p=require('./apps/cli/package.json'); if ('v'+p.version !== process.env.GITHUB_REF_NAME) { console.error('Tag/version mismatch'); process.exit(1) }"
      - run: pnpm verify
      - run: pnpm pack:cli
      - name: Installed release package smoke
        run: |
          mkdir -p "$RUNNER_TEMP/agentplugin-release-smoke"
          cd "$RUNNER_TEMP/agentplugin-release-smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/artifacts/*.tgz --ignore-scripts
          ./node_modules/.bin/agentplugin --version
          ./node_modules/.bin/agentplugin build --openapi "$GITHUB_WORKSPACE/fixtures/openapi/search.json" --name release-smoke --out out --json
          ./node_modules/.bin/agentplugin validate out --json
          ./node_modules/.bin/agentplugin scan out --json
          ./node_modules/.bin/agentplugin compat out --all --json
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/*.tgz --generate-notes --verify-tag
