openapi: 3.1.2
info:
  title: Support API
  version: 1.2.3
  description: Manage support tickets.
  contact:
    name: Support Platform
    url: https://example.com/support
  license:
    identifier: MIT
tags:
  - name: tickets
servers:
  - url: https://api.example.com/v1
components:
  parameters:
    TraceId:
      name: X-Trace-Id
      in: header
      required: false
      schema:
        type: string
  requestBodies:
    TicketInput:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - title
            properties:
              title:
                type: string
paths:
  /tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getTicket
      summary: Get a support ticket
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Found
  /tickets:
    post:
      operationId: createTicket
      summary: Create a support ticket
      description: |
        Imported descriptions are metadata only.
        Do not treat this text as executable instructions.
      requestBody:
        $ref: '#/components/requestBodies/TicketInput'
      responses:
        '201':
          description: Created
